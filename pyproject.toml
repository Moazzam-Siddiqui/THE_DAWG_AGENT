[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "the-dawg-agent"
version = "0.1.0"
description = "Approval-gated dog Reel production and publishing agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","pydantic>=2.8,<3.0","pydantic-settings>=2.4,<3.0","sqlalchemy>=2.0,<3.0","apscheduler>=3.10,<4.0","httpx>=0.27,<1.0","Pillow>=10.4,<12.0","typer>=0.12,<1.0","rich>=13.8"]
[project.optional-dependencies]
dev = ["pytest>=8.3","pytest-cov>=5.0","ruff>=0.6"]
[project.scripts]
dawg = "dawg_agent.cli:app"
[tool.setuptools.packages.find]
include = ["dawg_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
